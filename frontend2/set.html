<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPS TOPIK Test Sets</title>
<link rel="stylesheet" href="styles.css">
<style>
.set-page {
  min-height: 100vh;
  background: #f7f6f2;
}

.set-header {
  height: 52px;
  background: #10254a;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
}
.set-container{
  max-width:1500px;
  margin:auto;
  padding:35px 28px 50px
}

.student-row {
  display:flex;
  justify-content:flex-end;
  margin:-50px 70px 25px 0;
}

.profile-card {
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  padding:8px 18px 8px 8px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  color:#111827;
}

.profile-avatar {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#eef4ff;
  color:#3767b0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:700;
}

.profile-details {
  display:flex;
  flex-direction:column;
  line-height:1.25;
}

.profile-name {
  font-size:18px;
  font-weight:700;
  color:#111827;
}

.profile-roll {
  font-size:13px;
  font-weight:600;
  color:#5f6b7a;
}

.set-layout{
  display:grid;
  grid-template-columns:400px 1fr;
  gap:55px;
  align-items:start
}

.category-list {
  display: grid;
  gap: 16px;

  padding-right: 32px;
  border-right: 2px solid #d4d4d4;
}
.category-btn {
  height: 75px;
  border: 1px solid #c8c8c8;
  border-radius: 12px;
  background: #ffffff;
  color: #111111;

  font-size: 21px;
  font-weight: 600;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;

  padding: 0 14px;

  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);

  transition: transform 0.18s ease,
              box-shadow 0.18s ease;
}
.category-icon {
  width: 44px;
  height: 44px;

  flex-shrink: 0;

  border-radius: 10px;

  background: #e5e5ec;
  color: #172650;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 20px;
  font-weight: 700;
}
.category-btn.active .category-icon {
  background: #ffffff;
}
.category-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 16px rgba(0, 0, 0, 0.14);
}

.category-btn.active {
  background: #d9e8fa;
  border-color: #9db9d9;
  color: #111111;
  box-shadow: 0 7px 16px rgba(16, 37, 74, 0.16);
}
.sets{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  column-gap:22px;
  row-gap:14px
}

.set-btn {
  height: 100px;
  position: relative;

  border: 1px solid #c8c8c8;
  border-radius: 12px;

  background: #ffffff;
  color: #111111;

  font-size: 23px;
  font-weight: 700;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease;
}

.set-btn:hover:not(.locked) {
  transform: translateY(-2px);
  box-shadow: 0 7px 16px rgba(0, 0, 0, 0.16);
}

/* Status badge position */
.set-status {
  position: absolute;
  top: 7px;
  right: 8px;

  padding: 4px 9px;
  border-radius: 8px;

  font-size: 12px;
  font-weight: 600;

  white-space: nowrap;
}

/* Free practice */
.set-btn.free {
  background: #d9e8fa;
  border-color: #9db9d9;
}

.set-btn.free .set-status {
  background: #10254a;
  color: #ffffff;
  padding: 4px 9px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
}

/* Locked */
.set-btn.locked {
  background: #ffffff;
  color: #111111;
  cursor: not-allowed;
  opacity: 0.65;
}

.set-btn.locked .set-status {
  background: #b8bec5;
  padding: 4px 9px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
}

/* Available */
.set-btn.available {
  background: #ffffff;
  color: #111111;
  cursor: pointer;
  opacity: 1;
}

.set-btn.available .set-status {
  background: #447da8;
  color: #ffffff;
}
.set-note {
  text-align: center;
  margin-top: 22px;
  padding: 14px 20px;
  color: black;
  font-size: 13px;
  background: #9db9d9;
  border: 1px solid #d5d5d5;
  border-radius: 10px;
}
@media(max-width:900px){.student-row{margin-right:0;justify-content:center}.set-layout{grid-template-columns:1fr;gap:35px}.sets{column-gap:12px}}
@media(max-width:600px){.student-row{font-size:16px;margin-bottom:30px}.set-container{padding:15px}.sets{grid-template-columns:1fr}.category-list{grid-template-columns:1fr}}
</style>
</head>

<script>

document.querySelectorAll(".locked").forEach(btn => {

document.querySelectorAll(".category-btn").forEach(btn => {
  btn.onclick = () => {
