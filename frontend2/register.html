<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>EPS TOPIK - Register</title>

  <link rel="stylesheet" href="style.css">

</head>


<body class="auth-body">


<main class="auth-page">

  <section class="auth-card register-card">


    <!-- LOGO -->

    <a href="index.html" class="auth-logo">

      <div class="auth-logo-mark">
        K
      </div>

      <div>

        <h1>EPS TOPIK</h1>

        <span>
          EXAM PLATFORM
        </span>

      </div>

    </a>


    <!-- HEADING -->

    <div class="auth-heading">

      <p class="auth-eyebrow">
        CREATE ACCOUNT
      </p>

      <h2>
        Create your account
      </h2>

      <p>
        Register to access EPS TOPIK tests,
        results and your personal dashboard.
      </p>

    </div>


    <div id="messageBox"
         class="message-box">
    </div>


    <!-- REGISTER FORM -->

    <form id="registerForm">


      <div class="form-group">

        <label for="registerName">
          Full Name
        </label>

        <input
          type="text"
          id="registerName"
          placeholder="Enter your full name"
          required
        >

      </div>


      <div class="form-group">

        <label for="registerEmail">
          Email
        </label>

        <input
          type="email"
          id="registerEmail"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="form-group">

        <label for="studentId">
          Phone No.
        </label>

        <input
          type="text"
          id="studentId"
          placeholder="Enter your student ID"
        >

      </div>


      <div class="form-group">

        <label for="registerPassword">
          Password
        </label>


        <div class="password-box">

          <input
            type="password"
            id="registerPassword"
            placeholder="Create a password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('registerPassword', this)"
          >
            Show
          </button>

        </div>

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>


        <div class="password-box">

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('confirmPassword', this)"
          >
            Show
          </button>

        </div>

      </div>


      <label class="checkbox-row">

        <input
          type="checkbox"
          id="terms"
          required
        >

        <span>
          I agree to the
          <a href="#">Terms & Conditions</a>
          and
          <a href="#">Privacy Policy</a>.
        </span>

      </label>


      <button
        type="submit"
        id="registerButton"
        class="auth-submit"
      >
        Create Account
      </button>

    </form>


    <p class="auth-switch">

      Already have an account?

      <a href="login.html">
        Log in
      </a>

    </p>


    <a
      href="index.html"
      class="auth-back"
    >
      ← Back to home
    </a>


  </section>

</main>


<script src="script.js"></script>

</body>

</html>
